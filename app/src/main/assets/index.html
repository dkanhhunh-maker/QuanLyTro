    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: #0f766e;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      overscroll-behavior-y: none;
    }

    /* Ẩn mũi tên tăng giảm mặc định của ô input number trên di động */
    input[type='number']::-webkit-inner-spin-button,
    input[type='number']::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type='number'] {
      -moz-appearance: textfield;
    }

    /* Tối ưu thanh cuộn ngang cho danh sách chọn phòng */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Định dạng khi In: Giữ nguyên 100% giao diện, màu sắc, khung viền & font chữ Inter như phần Xem QR */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      body * {
        visibility: hidden;
      }
      #printable-receipt-area,
      #printable-receipt-area * {
        visibility: visible;
      }
      #printable-receipt-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        max-width: 380px !important;
        padding: 16px !important;
        margin: 0 auto !important;
        background: #ffffff !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

          : JSON.parse(JSON.stringify(DEFAULT_INVOICES));

      }

          localStorage.getItem('nhatro_standalone_settings_v2');

          ? { ...DEFAULT_SETTINGS, ...JSON.parse(savedSettings) }
          : { ...DEFAULT_SETTINGS };

          state.settings.houseName = 'NHÀ TRỌ & KIOT HOÀ NGUYỄN';
        }
        if (state.settings.accountName === 'NGUYEN VAN A') {
          state.settings.accountName = 'HOA NGUYEN';

        if (!state.settings.landlordName || state.settings.landlordName === 'Hoà Nguyễn') {

        }
        if (!state.settings.landlordPhone || state.settings.landlordPhone === '0909.888.999') {
          state.settings.landlordPhone = '0353633755';
        }
        const localPrinter = localStorage.getItem('nhatro_device_printer_v3');
        if (localPrinter) {
          const lp = JSON.parse(localPrinter);
          if (lp && lp.deviceOnly) {
            state.settings.printerIp = lp.ip || state.settings.printerIp;
            state.settings.printerPort = lp.port || state.settings.printerPort;
            state.settings.printerDeviceOnly = true;
          }
        }
        state.printerForm = {
          ip: state.settings.printerIp || '192.168.2.60',
          port: String(state.settings.printerPort || '9100'),
          mode: state.settings.printerMode || 'AUTO',
          deviceOnly: Boolean(state.settings.printerDeviceOnly)
        };
      } catch (e) {
        state.settings = { ...DEFAULT_SETTINGS };
      }

      syncSelectedRoomId();
    }

    function syncSelectedRoomId() {
      if (state.rooms.length === 0) {
        state.selectedCalculatorRoomId = null;
      } else if (!state.rooms.some((r) => r.id === state.selectedCalculatorRoomId)) {
        state.selectedCalculatorRoomId = state.rooms[0].id;
      }
    }

      try {
        localStorage.setItem(STORAGE_KEY_ROOMS, JSON.stringify(state.rooms));

        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(state.settings));

    function formatVND(amount) {
      const n = Math.round(Number(amount) || 0);
      return n.toLocaleString('vi-VN') + 'đ';
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function removeVietnameseTones(str) {
      if (!str) return '';
      return String(str)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .replace(/[^a-zA-Z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function matchesSearch(targetText, query) {
      if (!query || !query.trim()) return true;
      const qRaw = query.toLowerCase().trim();
      const qNoTone = removeVietnameseTones(qRaw).toLowerCase();
      const tRaw = String(targetText || '').toLowerCase();
      const tNoTone = removeVietnameseTones(tRaw).toLowerCase();
      return tRaw.includes(qRaw) || tNoTone.includes(qNoTone);
    }

    function getCurrentDateString() {
      const now = new Date();
      return `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(
        2,
        '0'
      )}/${now.getFullYear()}`;
    }

    function getFloorLabel(floorLevel) {
      if (floorLevel === 'upstairs') return 'Trên lầu';
      if (floorLevel === 'ground') return 'Trệt';
      return '';
    }

    function getRoomCategorySummary(room) {
      if (!room) return '';
      const parts = [];
      if (room.zone && String(room.zone).trim()) parts.push(String(room.zone).trim());
      const fl = getFloorLabel(room.floorLevel);
      if (fl) parts.push(fl);
      return parts.join(' • ');
    }

    // Tính chi tiết hóa đơn của 1 phòng
    function calculateRoomBill(room) {
      if (!room) {
        return {
          baseRent: 0,
          extraPeopleCount: 0,
          extraPersonTotal: 0,
          electricUsage: 0,
          electricWarning: false,
          electricTotal: 0,
          waterUsage: 0,
          waterWarning: false,
          waterTotal: 0,
          trashFee: 0,
          previousDebt: 0,
          extraFeesTotal: 0,
          grandTotal: 0
        };
      }

      const baseRent = Number(room.baseRent) || 0;
      const stdOcc = Number(room.standardOccupants) || 2;
      const curOcc = Number(room.currentOccupants) || 1;
      const extraPersonFee = Number(room.extraPersonFee) || 0;

      // 1. Phụ thu thêm người vượt định mức
      const extraPeopleCount = Math.max(0, curOcc - stdOcc);
      const extraPersonTotal = extraPeopleCount * extraPersonFee;

      // 2. Tiền điện
      const oldE = Number(room.oldElectric) || 0;
      const newE = Number(room.newElectric) || 0;
      const ePrice = Number(room.electricPrice) || 0;
      let electricUsage = 0;
      let electricWarning = false;

      if (room.electricRollover) {
        const maxDial = oldE > 9999 ? 100000 : 10000;
        electricUsage = newE >= oldE ? newE - oldE : maxDial - oldE + newE;
      } else {
        if (newE < oldE) {
          electricWarning = true;
          electricUsage = 0;
        } else {
          electricUsage = newE - oldE;
        }
      }
      const electricTotal = electricUsage * ePrice;

      // 3. Tiền nước
      const oldW = Number(room.oldWater) || 0;
      const newW = Number(room.newWater) || 0;
      const wPrice = Number(room.waterPrice) || 0;
      let waterUsage = 0;
      let waterWarning = false;

      if (room.waterMode === 'person') {
        waterUsage = curOcc;
      } else {
        if (newW < oldW) {
          waterWarning = true;
          waterUsage = 0;
        } else {
          waterUsage = newW - oldW;
        }
      }
      const waterTotal = waterUsage * wPrice;

      // 4. Tiền rác & Nợ cũ
      const trashFee = Number(room.trashFee) || 0;
      const previousDebt = Number(room.previousDebt) || 0;

      // 5. Tổng phí phát sinh (tạm trú, sửa điện...)
      const extraFeesList = Array.isArray(room.extraFees) ? room.extraFees : [];
      const extraFeesTotal = extraFeesList.reduce(
        (sum, item) => sum + (Number(item.amount) || 0),
        0
      );

      // 6. Tổng cộng cần thanh toán
      const grandTotal =
        baseRent +
        extraPersonTotal +
        electricTotal +
        waterTotal +
        trashFee +
        extraFeesTotal +
        previousDebt;

      return {
        baseRent,
        extraPeopleCount,
        extraPersonTotal,
        electricUsage,
        electricWarning,
        electricTotal,
        waterUsage,
        waterWarning,
        waterTotal,
        trashFee,
        previousDebt,
        extraFeesTotal,
        grandTotal
      };
    }

    // Chuyển đổi thông tin phòng hiện tại thành đối tượng Invoice chuẩn để xem Phiếu Thu / Lưu lịch sử
    function buildInvoiceObjectFromRoom(room) {
      const bill = calculateRoomBill(room);

        currentOccupants: Number(room.currentOccupants) || 1,
        extraPersonFee: Number(room.extraPersonFee) || 0,
        extraPeopleCount: bill.extraPeopleCount,
        extraPersonTotal: bill.extraPersonTotal,
        electric: {
          oldIndex: Number(room.oldElectric) || 0,
          newIndex: Number(room.newElectric) || 0,

        },

        },

    // Copy văn bản an toàn trên cả iFrame, iOS Safari và Android Chrome
    function copyTextToClipboard(text, successMsg = 'Đã sao chép vào bộ nhớ tạm!') {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '0';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (ok) {
          showToast(successMsg, 'success');
          return;
        }
      } catch (err) {
        // Fallback sang navigator.clipboard
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(text)
          .then(() => showToast(successMsg, 'success'))
          .catch(() => showToast('Không thể copy tự động, hãy chọn và copy thủ công.', 'error'));
      } else {
        showToast('Đã thực hiện lệnh sao chép!', 'success');
      }
    }

    // 5B. TẠO LỆNH ESC/POS KHỔ 80MM (48 KÝ TỰ/DÒNG) & GỬI QUA WIFI PORT 9100

    function padLine80mm(left, right, width = 48) {
      const l = removeVietnameseTones(String(left || ''));
      const r = removeVietnameseTones(String(right || ''));
      const space = Math.max(1, width - l.length - r.length);
      return l + ' '.repeat(space) + r;
    }

      const GS = '\x1D';
      const INIT = ESC + '@';

    // ============================================================================
    // 5C. CHỤP & DỰNG NGUYÊN MẪU GIAO DIỆN "XEM QR" (FONT INTER + MÃ VIETQR) RA BITMAP ESC/POS (GS v 0)
    //     Giúp máy in nhiệt WiFi K80 in ra GIỐNG HỆT 100% những gì nhìn thấy trong "Xem QR"
    //     (Không bị đổi sang font chữ máy in thô hay giao diện khác)
    // ============================================================================
    function loadQrImageForCanvas(url) {
      return new Promise((resolve) => {
        if (!url) {
          resolve(null);
          return;
        }
        // Ưu tiên 1: Nếu trong DOM đang mở sẵn ảnh #receipt-vietqr-img đã tải xong
        const existingImg = document.getElementById('receipt-vietqr-img');
        if (existingImg && existingImg.complete && existingImg.naturalWidth > 0 && existingImg.src === url) {
          try {
            const testC = document.createElement('canvas');
            testC.width = 4;
            testC.height = 4;
            testC.getContext('2d').drawImage(existingImg, 0, 0, 4, 4);
            testC.toDataURL();
            resolve(existingImg);
            return;
          } catch (e) {}
        }

        // Ưu tiên 2: Nếu chạy trong Android APK có cầu nối tải ảnh Base64 gốc (không bao giờ dính CORS)
        if (
          window.AndroidPrinterBridge &&
          typeof window.AndroidPrinterBridge.fetchImageBase64 === 'function'
        ) {
          try {
            const b64 = window.AndroidPrinterBridge.fetchImageBase64(url);
            if (b64 && b64.startsWith('data:image/')) {
              const imgNative = new Image();
              imgNative.onload = () => resolve(imgNative);
              imgNative.onerror = () => resolve(null);
              imgNative.src = b64;
              return;
            }
          } catch (e) {}
        }

        // Ưu tiên 3: Tải trực tiếp với crossOrigin = anonymous
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timer = setTimeout(() => resolve(null), 3200);
        img.onload = () => {
          clearTimeout(timer);
          resolve(img);
        };
        img.onerror = () => {
          clearTimeout(timer);
          resolve(null);
        };
        img.src = url;
      });
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawDashedLine(ctx, x1, x2, y) {
      ctx.save();
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.restore();
    }

    async function renderVisualReceiptToCanvas(inv) {
      const s = state.settings;
      const bankObj = VIETQR_BANKS.find((b) => b.bin === s.bankBin);
      const transferContent = removeVietnameseTones(`${inv.roomName} dong tien T${inv.month}`);
      // Khi IN: dùng ảnh "qr_only" (chỉ có mã QR, không có logo/tiêu đề) để in được LỚN và quét dễ.
      // Nếu tải ảnh này lỗi thì quay về ảnh compact2 như trong màn hình Xem QR.
      const buildQrUrl = (template) =>
        s.accountNo
          ? `https://img.vietqr.io/image/${s.bankBin}-${s.accountNo}-${template}.png?amount=${Math.max(
              0,
              inv.grandTotal
            )}&addInfo=${encodeURIComponent(transferContent)}&accountName=${encodeURIComponent(
              s.accountName
            )}`
          : '';

      let qrImg = s.accountNo ? await loadQrImageForCanvas(buildQrUrl('qr_only')) : null;
      if (s.accountNo && !qrImg) qrImg = await loadQrImageForCanvas(buildQrUrl('compact2'));

      const W = 576; // Chuẩn khổ máy in nhiệt K80 (576 dots = 72 bytes/dòng)
      const padX = 28;
      const innerW = W - padX * 2;
      const fontFamily = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

      // Tính chiều cao động theo đúng các mục hiển thị trong phần Xem QR
      let totalH = 36;
      totalH += 36 + 28 + 44 + 20; // Header + Người quản lý + Pill Kỳ thu
      totalH += 34 * 3 + 22; // Phòng/Kiot, Khách thuê, Ngày lập phiếu

      totalH += 38; // 1. Tiền phòng cơ bản
      if (inv.extraPersonTotal > 0) totalH += 56; // 2. Phụ thu thêm người
      totalH += 56; // 3. Tiền điện
      totalH += 56; // 4. Tiền nước
      if (inv.trashFee > 0) totalH += 38; // 5. Tiền rác
      if (inv.extraFees && inv.extraFees.length > 0) {
        totalH += 36 + inv.extraFees.length * 30; // 6. Phí phát sinh
      }
      if (inv.previousDebt !== 0) totalH += 38; // 7. Nợ cũ
      totalH += 20;

      totalH += 68; // TỔNG CỘNG
      if (s.accountNo) {
        totalH += 40 + (qrImg ? 470 : 30) + 92; // Khung VietQR + Thông tin TK
      }

    function convertCanvasToEscPosRasterBytes(canvas) {
      const width = 576; // 72 bytes / dòng (chuẩn máy in 80mm)
      const height = canvas.height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, width, height).data;
      const bytesPerRow = width / 8; // 72

      const out = [];
      // Khởi tạo máy in (ESC @) + Căn giữa (ESC a 1)
      out.push(0x1b, 0x40, 0x1b, 0x61, 0x01);

      // Chia thành từng dải ngang 120 dòng để mọi dòng máy in WiFi K80 nhận mượt không tràn bộ đệm
      const bandHeight = 120;
      for (let y0 = 0; y0 < height; y0 += bandHeight) {
        const h = Math.min(bandHeight, height - y0);
        // Lệnh in ảnh bitmap chuẩn ESC/POS: GS v 0 m xL xH yL yH
        out.push(
          0x1d,
          0x76,
          0x30,
          0x00,
          bytesPerRow & 0xff,
          (bytesPerRow >> 8) & 0xff,
          h & 0xff,
          (h >> 8) & 0xff
        );

        for (let y = y0; y < y0 + h; y++) {
          for (let bx = 0; bx < bytesPerRow; bx++) {
            let bVal = 0;
            for (let bit = 0; bit < 8; bit++) {
              const x = bx * 8 + bit;
              const idx = (y * width + x) * 4;
              const alpha = imgData[idx + 3];
              const r = imgData[idx];
              const g = imgData[idx + 1];
              const b = imgData[idx + 2];
              const lum = alpha < 128 ? 255 : 0.299 * r + 0.587 * g + 0.114 * b;
              if (lum < 185) {
                bVal |= 1 << (7 - bit);
              }
            }
            out.push(bVal);
          }
        }
      }

      // Đẩy giấy 4 dòng + Cắt giấy tự động (GS V 65 3)
      out.push(0x0a, 0x0a, 0x0a, 0x0a, 0x1d, 0x56, 0x41, 0x03);
      return new Uint8Array(out);
    }

    function uint8ArrayToBase64(bytes) {
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return window.btoa(binary);
    }

    async function buildVisualReceiptEscPosBase64(inv) {
      const canvas = await renderVisualReceiptToCanvas(inv);
      const rasterBytes = convertCanvasToEscPosRasterBytes(canvas);
      return {
        escPosBase64: uint8ArrayToBase64(rasterBytes),
        pngDataUrl: canvas.toDataURL('image/png')
      };
    }

    function isRunningInsideAndroidApk() {
      return Boolean(
        window.AndroidPrinterBridge &&
          typeof window.AndroidPrinterBridge.printRawEscPos === 'function'
      );
    }

    function encodeEscPosToBase64(str) {
      try {
        const bytes = new Uint8Array(str.length);
        for (let i = 0; i < str.length; i++) {
          bytes[i] = str.charCodeAt(i) & 0xff;
        }
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
      } catch (e) {
        return window.btoa(unescape(encodeURIComponent(str)));
      }
    }

    function sendViaRawBtAndroidBridge(rawPayload, isAlreadyBase64 = false) {
      try {
        const base64Data = isAlreadyBase64 ? rawPayload : encodeEscPosToBase64(rawPayload);
        const rawbtUrl = `rawbt:base64,${base64Data}`;
        const link = document.createElement('a');
        link.href = rawbtUrl;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(() => {
          if (link.parentNode) link.parentNode.removeChild(link);
        }, 500);
        return { ok: true, method: 'RAWBT_APP' };
      } catch (e) {
        return { ok: false, error: e };
      }
    }

    async function sendRawToWifiPrinter(ip, port, rawPayload, isAlreadyBase64 = false) {
      const cleanIp = String(ip || '192.168.2.60').trim();
      const cleanPort = parseInt(String(port || '9100').trim(), 10) || 9100;
      const mode = state.settings.printerMode || 'AUTO';
      const base64Data = isAlreadyBase64 ? rawPayload : encodeEscPosToBase64(rawPayload);

      // CÁCH 1: Đang chạy trong ứng dụng Android APK (Có Native TCP Socket Bridge thật kết nối thẳng tới IP:9100)
      if (isRunningInsideAndroidApk() && (mode === 'AUTO' || mode === 'APK_SOCKET')) {
        try {
          const resultStr = window.AndroidPrinterBridge.printRawEscPos(
            cleanIp,
            cleanPort,
            base64Data
          );
          if (resultStr === 'OK' || String(resultStr).startsWith('OK')) {
            return { ok: true, method: 'APK_SOCKET', detail: `${cleanIp}:${cleanPort}` };
          } else {
            return { ok: false, method: 'APK_SOCKET', error: resultStr };
          }
        } catch (err) {
          return { ok: false, method: 'APK_SOCKET', error: String(err) };
        }
      }

      // CÁCH 2: Chế độ gọi cầu nối RawBT trên điện thoại Android (In thật 100% không cần cài Android Studio)
      if (mode === 'RAWBT_APP') {
        return sendViaRawBtAndroidBridge(base64Data, true);
      }

      // CÁCH 3: Chế độ mở hộp thoại In hệ thống khổ 80mm của Android (Mopria / WiFi Direct Print Service)
      if (mode === 'SYSTEM_PRINT') {
        return { ok: false, method: 'SYSTEM_PRINT' };
      }

      // CÁCH 4 (AUTO khi mở trên trình duyệt web thường): Thử gửi gói tin tới IP:Port hoặc chuyển sang Hộp thoại In
      const endpoint = `http://${cleanIp}:${cleanPort}`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2200);

      try {
        await fetch(endpoint, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: rawPayload,
          signal: controller.signal
        });
        clearTimeout(timer);
        return { ok: true, method: 'BROWSER_FETCH' };
      } catch (err) {
        clearTimeout(timer);
        return { ok: false, error: err };
      }
    }

          electricRollover: Boolean(m.electricRollover),
          waterMode: m.waterMode === 'person' ? 'person' : 'meter',
          waterPrice: Number(m.waterPrice) || 0,
          oldWater: Number(m.oldWater) || 0,
          newWater:
            Number(m.newWater) < Number(m.oldWater) && m.isNew
              ? Number(m.oldWater) || 0
              : Number(m.newWater) || 0,
          trashFee: Number(m.trashFee) || 0,
          previousDebt: Number(m.previousDebt) || 0,
          extraFees: Array.isArray(m.extraFees) ? m.extraFees : [],
          status: m.status || 'UNPAID',
          note: String(m.note || 'Thanh toán từ ngày 01 - 05 hàng tháng').trim()
        };

        if (m.isNew) {
          state.rooms.push(cleanedRoom);
          state.selectedCalculatorRoomId = cleanedRoom.id;
          showToast(`Đã thêm mới "${cleanedRoom.name}" thành công!`);
        } else {
          const index = state.rooms.findIndex((r) => r.id === cleanedRoom.id);
          if (index !== -1) {
            state.rooms[index] = cleanedRoom;
          }
          showToast(`Đã lưu thông tin chi tiết "${cleanedRoom.name}"!`);
        }

        state.roomFormModal = null;
        saveData();
        renderApp();
      },

      // ==========================================
      // XOÁ PHÒNG AN TOÀN (KÈM TUỲ CHỌN XOÁ LỊCH SỬ HOÁ ĐƠN)
      // ==========================================
      openDeleteRoomModal(roomId) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room) return;
        const relatedInvoicesCount = state.invoices.filter((inv) => inv.roomId === roomId).length;
        state.deleteRoomModal = {
          roomId: room.id,
          roomName: room.name,
          tenantName: room.tenantName,
          relatedInvoicesCount,
          deleteInvoicesToo: false
        };
        renderApp();
      },

      toggleDeleteInvoicesOption(checked) {
        if (!state.deleteRoomModal) return;
        state.deleteRoomModal.deleteInvoicesToo = Boolean(checked);
        renderApp();
      },

      closeDeleteRoomModal() {
        state.deleteRoomModal = null;
        renderApp();
      },

      confirmDeleteRoom() {
        const d = state.deleteRoomModal;
        if (!d) return;

        state.rooms = state.rooms.filter((r) => r.id !== d.roomId);

        if (d.deleteInvoicesToo) {
          state.invoices = state.invoices.filter((inv) => inv.roomId !== d.roomId);
        }

        if (state.roomFormModal && state.roomFormModal.id === d.roomId) {
          state.roomFormModal = null;
        }
        state.deleteRoomModal = null;

        syncSelectedRoomId();
        saveData();
        showToast(
          d.deleteInvoicesToo
            ? `Đã xoá "${d.roomName}" và toàn bộ hoá đơn của phòng này!`
            : `Đã xoá "${d.roomName}" (vẫn giữ lại lịch sử hoá đơn cũ).`
        );
      },

      restoreSampleRooms() {
        state.rooms = JSON.parse(JSON.stringify(DEFAULT_ROOMS));
        syncSelectedRoomId();
        saveData();
        showToast('Đã tạo lại danh sách phòng mẫu!');
      },

      // ==========================================
      // CẬP NHẬT TRỰC TIẾP TRÊN MÀN HÌNH TÍNH TIỀN & GHI ĐỒNG HỒ NHANH
      // ==========================================
      updateRoomField(roomId, field, value, shouldRender = true) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room) return;

        const numericFields = [
          'baseRent',
          'standardOccupants',
          'currentOccupants',
          'extraPersonFee',
          'electricPrice',
          'oldElectric',
          'newElectric',
          'waterPrice',
          'oldWater',
          'newWater',
          'trashFee',
          'previousDebt'
        ];

        if (numericFields.includes(field)) {
          room[field] = value === '' ? 0 : Number(value);
        } else if (field === 'electricRollover') {
          room[field] = Boolean(value);
        } else {
          room[field] = value;
        }

        saveData();
        if (shouldRender) {
          renderApp();
        } else {
          updateLiveSummariesInDOM(roomId);
        }
      },

      stepOccupants(roomId, delta) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room) return;
        room.currentOccupants = Math.max(1, (Number(room.currentOccupants) || 1) + delta);
        saveData();
        renderApp();
      },

      togglePaidStatus(roomId) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room) return;
        room.status = room.status === 'PAID' ? 'UNPAID' : 'PAID';
        state.invoices.forEach((inv) => {
          if (inv.roomId === roomId && inv.month === state.settings.billingMonth) {
            inv.status = room.status;
          }
        });
        saveData();
        showToast(
          room.status === 'PAID'
            ? `Đã đánh dấu ĐÃ THU tiền ${room.name}`
            : `Đã chuyển ${room.name} về CHƯA THU`
        );
      },

      addQuickExtraFee(roomId, presetIndex) {
        const room = state.rooms.find((r) => r.id === roomId);
        const preset = QUICK_EXTRA_PRESETS[presetIndex];
        if (!room || !preset) return;
        if (!Array.isArray(room.extraFees)) room.extraFees = [];
        room.extraFees.push({
          id: 'ef_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          title: preset.title,
          amount: preset.amount
        });
        saveData();
        showToast(`Đã thêm "${preset.title}" (${formatVND(preset.amount)})`);
      },

      addCustomExtraFee(roomId) {
        const titleInput = document.getElementById('custom-fee-title');
        const amountInput = document.getElementById('custom-fee-amount');
        if (!titleInput || !amountInput) return;

        const title = titleInput.value.trim();
        const amount = Number(amountInput.value) || 0;
        if (!title) {
          showToast('Vui lòng nhập tên khoản phí phát sinh!', 'error');
          titleInput.focus();
          return;
        }

        const room = state.rooms.find((r) => r.id === roomId);
        if (!room) return;
        if (!Array.isArray(room.extraFees)) room.extraFees = [];
        room.extraFees.push({
          id: 'ef_' + Date.now(),
          title,
          amount
        });
        saveData();
        renderApp();
        showToast(`Đã thêm phí: ${title}`);
      },

      updateExtraFeeItem(roomId, feeId, field, val) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room || !Array.isArray(room.extraFees)) return;
        const item = room.extraFees.find((f) => f.id === feeId);
        if (!item) return;
        item[field] = field === 'amount' ? Number(val) || 0 : val;
        saveData();
        updateLiveSummariesInDOM(roomId);
      },

      removeExtraFeeItem(roomId, feeId) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room || !Array.isArray(room.extraFees)) return;
        room.extraFees = room.extraFees.filter((f) => f.id !== feeId);
        saveData();
        renderApp();
      },

      // ==========================================
      // LƯU HOÁ ĐƠN VÀO LỊCH SỬ & MỞ PHIẾU THU VIETQR
      // ==========================================
      saveAndOpenRoomReceipt(roomId) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room) return;
        const bill = calculateRoomBill(room);

        if (bill.electricWarning) {
          showToast(
            'Chỉ số Điện Mới đang nhỏ hơn Điện Cũ! Hãy kiểm tra lại hoặc bật nút Quay vòng đồng hồ.',
            'error'
          );
          return;
        }
        if (bill.waterWarning) {
          showToast('Chỉ số Nước Mới đang nhỏ hơn Nước Cũ! Hãy kiểm tra lại.', 'error');
          return;
        }

        const newInv = buildInvoiceObjectFromRoom(room);

        const existingIdx = state.invoices.findIndex(
          (i) => i.roomId === room.id && i.month === state.settings.billingMonth
        );
        if (existingIdx !== -1) {
          newInv.id = state.invoices[existingIdx].id;
          state.invoices[existingIdx] = newInv;
        } else {
          state.invoices.unshift(newInv);
        }

        state.receiptModalInvoice = newInv;
        saveData();
        renderApp();
      },

      openExistingInvoiceReceipt(invoiceId) {
        const inv = state.invoices.find((i) => i.id === invoiceId);
        if (!inv) return;
        state.receiptModalInvoice = inv;
        renderApp();
      },

      closeReceiptModal() {
        state.receiptModalInvoice = null;
        renderApp();
      },

      toggleInvoiceStatusInHistory(invoiceId) {
        const inv = state.invoices.find((i) => i.id === invoiceId);
        if (!inv) return;
        inv.status = inv.status === 'PAID' ? 'UNPAID' : 'PAID';

        const room = state.rooms.find((r) => r.id === inv.roomId);
        if (room && inv.month === state.settings.billingMonth) {
          room.status = inv.status;
        }
        saveData();
        showToast(
          inv.status === 'PAID'
            ? `Đã đánh dấu ĐÃ THU phiếu ${inv.roomName}`
            : `Đã chuyển phiếu ${inv.roomName} về CHƯA THU`
        );
      },

      deleteInvoiceFromHistory(invoiceId) {
        const inv = state.invoices.find((i) => i.id === invoiceId);
        if (!inv) return;
        state.confirmModal = {
          title: 'Xoá phiếu thu này?',
          message: `Bạn có chắc muốn xoá phiếu thu của "${inv.roomName}" (Kỳ ${
            inv.month
          } - ${formatVND(inv.grandTotal)}) khỏi lịch sử?`,
          confirmText: 'Xoá Phiếu',
          danger: true,
          onConfirm: () => {
            state.invoices = state.invoices.filter((i) => i.id !== invoiceId);
            if (state.receiptModalInvoice && state.receiptModalInvoice.id === invoiceId) {
              state.receiptModalInvoice = null;
            }
            state.confirmModal = null;
            saveData();
            showToast('Đã xoá phiếu thu khỏi lịch sử.');
          }
        };
        renderApp();
      },

      // Chốt sang kỳ tháng mới cho tất cả các phòng
      rolloverAllRoomsToNewMonth() {
        if (state.rooms.length === 0) return;
        state.confirmModal = {
          title: 'Sang kỳ thu tiền tháng mới?',
          message:
            'Hệ thống sẽ tự động lưu các hóa đơn kỳ hiện tại vào Lịch sử, lấy Chỉ số Điện/Nước MỚI chuyển thành Chỉ số CŨ cho tháng tiếp theo, xoá trống các khoản phí phát sinh 1 lần (tạm trú, sửa điện) và đặt trạng thái các phòng về Chưa thu.',
          confirmText: 'Chốt Sang Tháng Mới',
          danger: false,
          onConfirm: () => {
            state.rooms.forEach((r) => {
              const exists = state.invoices.some(
                (i) => i.roomId === r.id && i.month === state.settings.billingMonth
              );
              if (!exists) {
                state.invoices.unshift(buildInvoiceObjectFromRoom(r));
              }
            });

            state.rooms.forEach((r) => {
              r.oldElectric = Number(r.newElectric) || r.oldElectric;
              if (r.waterMode === 'meter') {
                r.oldWater = Number(r.newWater) || r.oldWater;
              }
              r.electricRollover = false;
              r.extraFees = [];
              r.previousDebt = 0;
              r.status = 'UNPAID';
            });
            state.confirmModal = null;
            saveData();
            showToast('Đã chuyển chỉ số cũ và sang kỳ tháng mới thành công!');
          }
        };
        renderApp();
      },

      // Cài đặt chung & Ngân hàng VietQR
      updateSettingField(field, value) {
        const numFields = [
          'defaultElectricPrice',
          'defaultWaterPrice',
          'defaultTrashFee',
          'defaultExtraPersonFee',
          'defaultStandardOccupants'

        saveData();
      },

          showToast('Chưa có phòng nào để áp dụng!', 'error');
          return;
        }
        state.confirmModal = {

          )}/kWh), Giá nước (${formatVND(
            state.settings.defaultWaterPrice
          )}), Tiền rác (${formatVND(

          )}) và Phụ thu thêm người (${formatVND(

              r.waterPrice = Number(state.settings.defaultWaterPrice) || r.waterPrice;

      },

      // Sao lưu & Đồng bộ dữ liệu (Hoạt động 100% cả trên Android APK lẫn Trình duyệt Web)
      exportBackupJson() {
        const fileName = `SaoLuu_NhaTro_${new Date().toISOString().slice(0, 10)}.json`;
        const payload = {
          app: 'QuanLyNhaTro_Standalone_v3',
          exportedAt: new Date().toISOString(),
          settings: state.settings,
          rooms: state.rooms,
          invoices: state.invoices
        };
        const jsonString = JSON.stringify(payload, null, 2);

        // 1. Nếu đang chạy trong ứng dụng Android APK -> Gọi Native File Saver / Share của Android
        if (
          window.AndroidPrinterBridge &&
          typeof window.AndroidPrinterBridge.saveBackupJson === 'function'
        ) {
          try {
            const res = window.AndroidPrinterBridge.saveBackupJson(fileName, jsonString);
            if (res && String(res).startsWith('OK')) {
              showToast(`✅ Đã xuất file sao lưu "${fileName}" thành công!`);
              return;
            }
          } catch (e) {
            console.warn('Android saveBackupJson error:', e);
          }
        }

        // 2. Nếu trình duyệt hỗ trợ Web Share API cho File trên di động
        try {
          if (navigator.canShare && window.File) {
            const fileObj = new File([jsonString], fileName, { type: 'application/json' });
            if (navigator.canShare({ files: [fileObj] })) {
              navigator.share({
                title: 'Sao Lưu Dữ Liệu Nhà Trọ',
                text: 'File sao lưu dữ liệu phòng trọ & hoá đơn',
                files: [fileObj]
              }).catch(() => {});
              showToast(`✅ Đã mở bảng Lưu / Chia sẻ file "${fileName}"!`);
              return;
            }
          }
        } catch (err) {}

        // 3. Tải xuống trực tiếp qua thẻ <a> (Blob URL + Data URI dự phòng)
        try {
          const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          showToast(`✅ Đã tải file sao lưu "${fileName}" về máy!`);
        } catch (e) {
          const dataUri =
            'data:application/json;charset=utf-8,' + encodeURIComponent(jsonString);
          const a = document.createElement('a');
          a.href = dataUri;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast(`✅ Đã xuất file sao lưu "${fileName}"!`);
        }
      },

      triggerImportBackupFile() {
        // Nếu đang chạy trong Android APK và có hàm mở trình chọn file gốc của Android
        if (
          window.AndroidPrinterBridge &&
          typeof window.AndroidPrinterBridge.openBackupFilePicker === 'function'
        ) {
          try {
            window.AndroidPrinterBridge.openBackupFilePicker();
            return;
          } catch (e) {
            console.warn('openBackupFilePicker fallback to input:', e);
          }
        }
        const fileInput = document.getElementById('backup-file-input');
        if (fileInput) {
          fileInput.value = '';
          fileInput.click();
        }
      },

      processImportedJsonString(rawText) {
        try {
          const cleaned = String(rawText || '').trim();
          const data = JSON.parse(cleaned);
          if (!Array.isArray(data.rooms)) {
            showToast('File sao lưu không đúng cấu trúc danh sách phòng!', 'error');
            return false;
          }
          state.rooms = data.rooms;
          if (Array.isArray(data.invoices)) state.invoices = data.invoices;
          if (data.settings) state.settings = { ...DEFAULT_SETTINGS, ...data.settings };
          syncSelectedRoomId();
          saveData();
          renderApp();
          showToast(`✅ Đã khôi phục thành công ${state.rooms.length} phòng và ${state.invoices.length} hoá đơn!`);
          return true;
        } catch (err) {
          showToast('❌ File sao lưu không hợp lệ hoặc bị lỗi định dạng JSON!', 'error');
          return false;
        }
      },

      importBackupJson(event) {
        const file = event.target && event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          window.appActions.processImportedJsonString(e.target.result);
        };
        reader.onerror = () => {
          showToast('❌ Không thể đọc file đã chọn!', 'error');
        };
        reader.readAsText(file, 'UTF-8');
        event.target.value = '';
      },

      copySyncDataCode() {
        const payload = JSON.stringify({
          settings: state.settings,
          rooms: state.rooms,
          invoices: state.invoices
        });
        copyTextToClipboard(
          payload,
          'Đã copy Mã Dữ Liệu! Bạn có thể gửi qua Zalo sang máy kia rồi dán vào.'
        );
      },

      applySyncDataCode() {

          showToast('Vui lòng dán mã dữ liệu vào ô trước!', 'error');
          return;

        try {
          const parsed = JSON.parse(inputEl.value.trim());
          if (!Array.isArray(parsed.rooms)) throw new Error('Invalid');
          state.rooms = parsed.rooms;
          if (Array.isArray(parsed.invoices)) state.invoices = parsed.invoices;
          if (parsed.settings) state.settings = { ...DEFAULT_SETTINGS, ...parsed.settings };
          syncSelectedRoomId();
          saveData();
          showToast('Đã đồng bộ dữ liệu phòng trọ thành công!');
        } catch (e) {

        }
      },

      copyZaloFromInvoiceModal() {

        const text = generateZaloMessageFromInvoice(state.receiptModalInvoice);
        copyTextToClipboard(
          text,
          `Đã copy phiếu thu ${state.receiptModalInvoice.roomName}! Mở Zalo dán gửi khách ngay.`

      copyZaloForRoom(roomId) {

      // ==========================================
      // KẾT NỐI MÁY IN NHIỆT WIFI (PORT 9100) & IN HÓA ĐƠN KHỔ 80MM
      // ==========================================
      openPrinterModal() {
        state.printerForm = {
          ip: state.settings.printerIp || '192.168.2.60',
          port: String(state.settings.printerPort || '9100'),
          mode: state.settings.printerMode || 'AUTO',
          deviceOnly: Boolean(state.settings.printerDeviceOnly)
        };
        state.printerModalOpen = true;
        renderApp();
      },

      closePrinterModal() {
        state.printerModalOpen = false;
        renderApp();
      },

      updatePrinterFormField(field, val) {
        if (field === 'deviceOnly') {
          state.printerForm.deviceOnly = Boolean(val);
          renderApp();
        } else if (field === 'mode') {
          state.printerForm.mode = val;
          state.settings.printerMode = val;
          saveData();
          renderApp();
        } else {
          state.printerForm[field] = val;
        }
      },

      savePrinterConfig() {
        const ip = String(state.printerForm.ip || '').trim();
        const port = String(state.printerForm.port || '9100').trim();
        const mode = state.printerForm.mode || 'AUTO';
        const deviceOnly = Boolean(state.printerForm.deviceOnly);

        if (!ip) {
          showToast('Vui lòng nhập Địa chỉ IP của máy in (VD: 192.168.2.60)!', 'error');
          return;
        }
        if (!port || isNaN(Number(port))) {
          showToast('Vui lòng nhập Port hợp lệ (mặc định là 9100)!', 'error');
          return;
        }

        state.settings.printerIp = ip;
        state.settings.printerPort = port;
        state.settings.printerMode = mode;
        state.settings.printerDeviceOnly = deviceOnly;

        try {
          if (deviceOnly) {
            localStorage.setItem(
              'nhatro_device_printer_v3',
              JSON.stringify({ ip, port, mode, deviceOnly: true })
            );
          } else {
            localStorage.removeItem('nhatro_device_printer_v3');
          }
        } catch (e) {}

        saveData();
        state.printerStatus = 'CONNECTED';
        state.printerModalOpen = false;
        showToast(`Đã lưu cấu hình máy in WiFi: ${ip}:${port}`);
      },

      async testWifiPrinter() {
        const ip = String(state.printerForm.ip || state.settings.printerIp || '192.168.2.60').trim();
        const port = String(state.printerForm.port || state.settings.printerPort || '9100').trim();
        if (!ip) {
          showToast('Vui lòng nhập Địa chỉ IP máy in trước khi In thử!', 'error');
          return;
        }

        state.settings.printerIp = ip;
        state.settings.printerPort = port;
        if (state.printerForm.mode) state.settings.printerMode = state.printerForm.mode;
        saveData();

        // Nếu đang chạy trong APK và có hàm testConnection riêng
        if (
          isRunningInsideAndroidApk() &&
          typeof window.AndroidPrinterBridge.testConnection === 'function' &&
          state.settings.printerMode !== 'RAWBT_APP' &&
          state.settings.printerMode !== 'SYSTEM_PRINT'
        ) {
          const checkRes = window.AndroidPrinterBridge.testConnection(ip, parseInt(port, 10) || 9100);
          if (checkRes !== 'OK' && !String(checkRes).startsWith('OK')) {
            showToast(`❌ Không kết nối được máy in ${ip}:${port} (${checkRes})`, 'error');
            return;
          }
        }

        state.printerStatus = 'SENDING';
        showToast(`🖨️ Đang gửi lệnh In thử tới máy in ${ip}:${port}...`);

        const payload = buildTestPrintEscPosPayload(ip, port);
        const res = await sendRawToWifiPrinter(ip, port, payload);

        if (res.ok && res.method === 'APK_SOCKET') {
          state.printerStatus = 'CONNECTED';
          showToast(`✅ [APK Socket] Đã in thử thành công ra máy in ${ip}:${port}!`);
        } else if (res.ok && res.method === 'RAWBT_APP') {
          state.printerStatus = 'CONNECTED';
          showToast(`✅ Đã truyền lệnh in sang cầu nối RawBT trên Android!`);
        } else if (res.ok) {
          state.printerStatus = 'CONNECTED';
          showToast(`✅ Đã gửi lệnh In thử tới ${ip}:${port}! (Nếu trình duyệt chặn, hãy chọn chế độ APK hoặc RawBT)`);
        } else {
          state.printerStatus = 'FALLBACK';
          showToast(
            res.error
              ? `⚠️ Lỗi kết nối ${ip}:${port}: ${res.error}`
              : `Đang mở hộp thoại in hệ thống cho máy in ${ip}:${port}...`,
            res.error ? 'error' : 'success'
          );
        }
      },

      // IN 1 CHẠM NGẦM NGAY LẬP TỨC VỚI ĐÚNG 100% GIAO DIỆN & FONT CHỮ CỦA "XEM QR" (CÓ CẢ MÃ VIETQR)
      async oneTouchPrintRoom(roomId) {
        const room = state.rooms.find((r) => r.id === roomId);
        if (!room) return;
        const bill = calculateRoomBill(room);
        if (bill.electricWarning) {
          showToast('Chỉ số Điện Mới đang nhỏ hơn Điện Cũ! Hãy kiểm tra lại.', 'error');
          return;
        }
        if (bill.waterWarning) {
          showToast('Chỉ số Nước Mới đang nhỏ hơn Nước Cũ! Hãy kiểm tra lại.', 'error');
          return;
        }

        const inv = buildInvoiceObjectFromRoom(room);
        const existingIdx = state.invoices.findIndex(
          (i) => i.roomId === room.id && i.month === state.settings.billingMonth
        );
        if (existingIdx !== -1) {
          inv.id = state.invoices[existingIdx].id;
          state.invoices[existingIdx] = inv;
        } else {
          state.invoices.unshift(inv);
        }
        saveData();

        await this.executeVisualXemQrPrint(inv);
      },

      async oneTouchPrintInvoice(invoiceId) {
        const inv = state.invoices.find((i) => i.id === invoiceId);
        if (!inv) return;
        await this.executeVisualXemQrPrint(inv);
      },

      async printInvoiceViaWifi80mm() {
        const inv = state.receiptModalInvoice;
        if (!inv) return;
        await this.executeVisualXemQrPrint(inv);
      },

      async executeVisualXemQrPrint(inv) {
        if (!inv) return;
        const ip = String(state.settings.printerIp || '192.168.2.60').trim();
        const port = String(state.settings.printerPort || '9100').trim();
        state.printerStatus = 'SENDING';

        if (
          state.settings.printerMode === 'SYSTEM_PRINT' &&
          window.AndroidPrinterBridge &&
          typeof window.AndroidPrinterBridge.openAndroidSystemPrint === 'function'
        ) {
          window.AndroidPrinterBridge.openAndroidSystemPrint();
          return;
        }

        showToast(`🖨️ Đang tạo bản in nguyên mẫu Xem QR "${inv.roomName}" tới ${ip}:${port}...`);

        try {
          const { escPosBase64 } = await buildVisualReceiptEscPosBase64(inv);

          // 1. Nếu đang chạy trong ứng dụng Android APK -> Bắn thẳng ảnh Bitmap ESC/POS của Xem QR qua cổng 9100
          if (isRunningInsideAndroidApk()) {
            const res = await sendRawToWifiPrinter(ip, port, escPosBase64, true);
            if (res.ok) {
              state.printerStatus = 'CONNECTED';
              showToast(`✅ Đã in nguyên mẫu Xem QR "${inv.roomName}" (${formatVND(inv.grandTotal)}) qua ${ip}:${port}!`);
            } else {
              state.printerStatus = 'FALLBACK';
              showToast(`❌ Lỗi kết nối máy in ${ip}:${port}: ${res.error || 'Kiểm tra lại WiFi'}`, 'error');
            }
            return;
          }

          // 2. Nếu đang mở trên điện thoại Android (chế độ RawBT)
          if (state.settings.printerMode === 'RAWBT_APP' || /Android/i.test(navigator.userAgent)) {
            sendViaRawBtAndroidBridge(escPosBase64, true);
            state.printerStatus = 'CONNECTED';
            showToast(`🖨️ Đã gửi bản in nguyên mẫu Xem QR "${inv.roomName}" tới máy in ${ip}:${port}!`);
            return;
          }

          // 3. Nếu đang mở trên trình duyệt máy tính -> Mở hộp thoại in đúng vùng #printable-receipt-area của Xem QR
          const hadModal = Boolean(state.receiptModalInvoice);
          if (!hadModal) {
            state.receiptModalInvoice = inv;
            renderApp();
          }
          state.printerStatus = 'CONNECTED';
          setTimeout(() => {
            window.print();
          }, 250);
        } catch (err) {
          console.error('Visual print error:', err);
          window.print();
        }
      },

      printInvoiceViaRawBtDirect() {
        const inv = state.receiptModalInvoice;
        if (!inv) return;
        const rawPayload = buildEscPos80mmPayload(inv);
        sendViaRawBtAndroidBridge(rawPayload);
        showToast('🚀 Đã gửi lệnh ESC/POS sang ứng dụng RawBT để in ngay!');
      }
    };

    window.onAndroidBackupFileLoaded = function (base64OrText, isBase64) {
      try {
        let jsonStr = base64OrText;
        if (isBase64) {
          const binary = window.atob(base64OrText);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          jsonStr = new TextDecoder('utf-8').decode(bytes);
        }
        window.appActions.processImportedJsonString(jsonStr);
      } catch (e) {
        showToast('❌ Lỗi đọc file sao lưu từ thiết bị Android!', 'error');
      }
    };

    function renderAppKeepFocus(inputId) {

      if (nextEl) {

          try {
            nextEl.setSelectionRange(pos, pos);
          } catch (e) {}
        }
      }

      const room = state.rooms.find((r) => r.id === roomId);
      if (!room) return;
      const bill = calculateRoomBill(room);

      const elTotalCard = document.getElementById(`room-card-total-${roomId}`);
      if (elTotalCard) elTotalCard.textContent = formatVND(bill.grandTotal);

      const elCalcGrand = document.getElementById('calc-live-grand-total');
      if (elCalcGrand) elCalcGrand.textContent = formatVND(bill.grandTotal);

      const elCalcExtraPerson = document.getElementById('calc-live-extra-person');
      if (elCalcExtraPerson) {
        elCalcExtraPerson.textContent = `+${formatVND(bill.extraPersonTotal)}`;
      }

      const elCalcElec = document.getElementById('calc-live-elec-summary');
      if (elCalcElec) {
        elCalcElec.textContent = `${bill.electricUsage} kWh = ${formatVND(bill.electricTotal)}`;
      }

      const elCalcWater = document.getElementById('calc-live-water-summary');
      if (elCalcWater) {
        elCalcWater.textContent = `${bill.waterUsage} ${
          room.waterMode === 'person' ? 'người' : 'm³'
        } = ${formatVND(bill.waterTotal)}`;
      }

      const elCalcExtraFees = document.getElementById('calc-live-extra-fees');
      if (elCalcExtraFees) {
        elCalcExtraFees.textContent =
          (bill.extraFeesTotal >= 0 ? '+' : '') + formatVND(bill.extraFeesTotal);
      }

      const totalAll = state.rooms.reduce((s, r) => s + calculateRoomBill(r).grandTotal, 0);
      const totalPaid = state.rooms
        .filter((r) => r.status === 'PAID')
        .reduce((s, r) => s + calculateRoomBill(r).grandTotal, 0);
      const elDashExpected = document.getElementById('dash-total-expected');
      const elDashUnpaid = document.getElementById('dash-total-unpaid');
      if (elDashExpected) elDashExpected.textContent = formatVND(totalAll);
      if (elDashUnpaid) elDashUnpaid.textContent = formatVND(totalAll - totalPaid);

              🏠
            </div>
            <div class="space-y-1">
              <h3 class="font-extrabold text-base text-slate-900">Chưa có Phòng trọ / Kiot nào</h3>
              <p class="text-xs text-slate-500 leading-relaxed">
                Danh sách phòng đang trống. Hãy bấm nút bên dưới để thêm Phòng trọ hoặc Kiot mới của bạn.
              </p>
            </div>
            <div class="flex flex-col gap-2 pt-2">
              <button
                onclick="appActions.openAddRoomModal()"
                class="w-full bg-teal-600 hover:bg-teal-700 active:scale-95 text-white font-extrabold text-xs py-3.5 px-4 rounded-2xl shadow-md transition"
              >
                + Thêm Phòng / Kiot Mới
              </button>
              <button
                onclick="appActions.restoreSampleRooms()"
                class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs py-2.5 px-4 rounded-xl transition"
              >
                🔄 Khôi Phục 4 Phòng Mẫu Để Dùng Thử
              </button>
            </div>
          </div>
        `;
      }

      const availableZones = Array.from(
        new Set(state.rooms.map((r) => String(r.zone || '').trim()).filter(Boolean))
      );
      const hasAnyFloor = state.rooms.some(
        (r) => r.floorLevel === 'ground' || r.floorLevel === 'upstairs'
      );
      const hasAnyClassification = availableZones.length > 0 || hasAnyFloor;

      // Lọc và sắp xếp danh sách phòng theo bộ lọc tìm kiếm, dãy phòng, trên lầu & trệt
      const filteredRooms = state.rooms
        .filter((r) => {
          if (state.roomFilterType !== 'ALL' && r.type !== state.roomFilterType) return false;
          if (state.roomFilterFloor !== 'ALL' && (r.floorLevel || '') !== state.roomFilterFloor)
            return false;
          if (
            state.roomFilterZone !== 'ALL' &&
            String(r.zone || '').trim() !== state.roomFilterZone
          )
            return false;
          if (state.roomFilterStatus !== 'ALL' && r.status !== state.roomFilterStatus) return false;
          if (state.roomSearchQuery.trim()) {
            const combined = `${r.name} ${r.zone || ''} ${getFloorLabel(r.floorLevel)} ${
              r.tenantName
            } ${r.tenantPhone} ${r.note || ''}`;
            if (!matchesSearch(combined, state.roomSearchQuery)) return false;
          }
          return true;
        })
        .sort((a, b) => {
          if (state.roomSortBy === 'total_desc') {
            return calculateRoomBill(b).grandTotal - calculateRoomBill(a).grandTotal;
          }
          if (state.roomSortBy === 'total_asc') {
            return calculateRoomBill(a).grandTotal - calculateRoomBill(b).grandTotal;
          }
          return 0;
        });

      const collectionProgress =
        totalExpected > 0 ? Math.min(100, Math.round((totalPaid / totalExpected) * 100)) : 0;

      // Hàm dựng HTML cho 1 thẻ phòng
      const renderSingleRoomCard = (room) => {
        const bill = calculateRoomBill(room);
        const isPaid = room.status === 'PAID';
        const zoneText = String(room.zone || '').trim();
        const floorText = getFloorLabel(room.floorLevel);

        return `
          <div class="bg-white rounded-2xl p-4 shadow-xs border ${
            isPaid ? 'border-emerald-200' : 'border-slate-200/90'
          } space-y-3 transition">
            <!-- Hàng 1: Tên phòng, Loại, Trạng thái -->
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md ${
                    room.type === 'kiot'
                      ? 'bg-purple-100 text-purple-700'
                      : 'bg-teal-100 text-teal-800'
                  }">${room.type === 'kiot' ? 'Kiot' : 'Phòng trọ'}</span>
                  ${
                    zoneText
                      ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 border border-slate-200">
                          📍 ${escapeHtml(zoneText)}
                        </span>`
                      : ''
                  }
                  ${
                    floorText
                      ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${
                          room.floorLevel === 'upstairs'
                            ? 'bg-indigo-50 text-indigo-700 border border-indigo-200'
                            : 'bg-amber-50 text-amber-800 border border-amber-200'
                        }">
                          ${room.floorLevel === 'upstairs' ? '⬆️ Trên lầu' : '⬇️ Trệt'}
                        </span>`
                      : ''
                  }
                  <h3 class="font-extrabold text-base text-slate-900 ${
                    zoneText || floorText ? 'w-full mt-0.5' : ''
                  }">${escapeHtml(room.name)}</h3>
                </div>
                <p class="text-xs text-slate-500 mt-0.5 truncate">
                  👤 ${escapeHtml(room.tenantName || 'Chưa ghi tên khách')}
                  ${room.tenantPhone ? ` • 📞 ${escapeHtml(room.tenantPhone)}` : ''}
                </p>
              </div>

              <button
                onclick="appActions.togglePaidStatus('${room.id}')"
                class="px-2.5 py-1 rounded-full text-[11px] font-extrabold flex items-center gap-1 shrink-0 transition ${
                  isPaid
                    ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                    : 'bg-amber-100 text-amber-900 border border-amber-300'
                }"
              >
                <span>${isPaid ? '✅ Đã Thu' : '⏳ Chưa Thu'}</span>
              </button>
            </div>

            <!-- Hàng 2: Tóm tắt Giá thuê, Người ở, Điện, Nước -->
            <div class="grid grid-cols-4 gap-1.5 bg-slate-50 rounded-xl p-2.5 text-xs border border-slate-100">
              <div>
                <div class="text-[10px] text-slate-400 font-semibold">Tiền phòng</div>
                <div class="font-bold text-slate-800 mt-0.5">${formatVND(room.baseRent)}</div>
                <div class="text-[10px] text-slate-400">Rác: ${formatVND(room.trashFee)}</div>
              </div>

              <div>
                <div class="text-[10px] text-slate-400 font-semibold">Người (ĐM:${
                  room.standardOccupants
                })</div>
                <div class="font-bold text-slate-800 mt-0.5">
                  ${room.currentOccupants} người
                  ${
                    bill.extraPeopleCount > 0
                      ? `<span class="block text-[10px] text-indigo-600 font-extrabold">+${formatVND(
                          bill.extraPersonTotal
                        )}</span>`
                      : `<span class="block text-[10px] text-slate-400">Chuẩn</span>`
                  }
                </div>
              </div>

              <div>
                <div class="text-[10px] text-slate-400 font-semibold">Điện (${room.oldElectric}→${
          room.newElectric
        })</div>
                <div class="font-bold text-slate-800 mt-0.5">
                  ${bill.electricUsage} kWh
                  <span class="block text-[10px] text-amber-700 font-extrabold">${formatVND(
                    bill.electricTotal
                  )}</span>
                </div>
              </div>

              <div>
                <div class="text-[10px] text-slate-400 font-semibold">${
                  room.waterMode === 'person'
                    ? 'Nước khoán'
                    : `Nước (${room.oldWater}→${room.newWater})`
                }</div>
                <div class="font-bold text-slate-800 mt-0.5">
                  ${bill.waterUsage} ${room.waterMode === 'person' ? 'ng' : 'm³'}
                  <span class="block text-[10px] text-sky-700 font-extrabold">${formatVND(
                    bill.waterTotal
                  )}</span>
                </div>
              </div>
            </div>

            <!-- Hàng 3: Hiển thị Phí phát sinh & Nợ cũ nếu có -->
            ${
              (room.extraFees && room.extraFees.length > 0) || Number(room.previousDebt) !== 0
                ? `<div class="flex flex-wrap gap-1.5">
                    ${(room.extraFees || [])
                      .map(
                        (ef) => `
                      <span class="text-[11px] bg-purple-50 text-purple-800 border border-purple-200 px-2 py-0.5 rounded-lg font-semibold">
                        🔧 ${escapeHtml(ef.title)}: <b>${
                          Number(ef.amount) >= 0 ? '+' : ''
                        }${formatVND(ef.amount)}</b>
                      </span>
                    `
                      )
                      .join('')}
                    ${
                      Number(room.previousDebt) !== 0
                        ? `<span class="text-[11px] bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-lg font-semibold">
                            📌 Nợ/Dư kỳ trước: <b>${formatVND(room.previousDebt)}</b>
                          </span>`
                        : ''
                    }
                  </div>`
                : ''
            }

            <!-- Hàng 4: Tổng cộng & Cụm nút Sửa chi tiết / Xoá phòng / Tính tiền / Xuất QR -->
            <div class="pt-2.5 border-t border-slate-100 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-500">Tổng cộng kỳ này:</span>
                <span class="text-lg font-black text-teal-700">${formatVND(bill.grandTotal)}</span>
              </div>

              <div class="grid grid-cols-4 gap-2">
                <button
                  type="button"
                  onclick="appActions.openEditRoomModal('${room.id}')"
                  class="w-full h-10 px-1.5 bg-slate-100 hover:bg-teal-50 hover:text-teal-800 active:scale-95 text-slate-700 border border-slate-200 font-extrabold text-[11px] sm:text-xs rounded-xl flex items-center justify-center gap-1 transition shadow-2xs whitespace-nowrap"
                  title="Sửa Chi Tiết Phòng"
                >
                  ${ICON_PENCIL}
                  <span>Sửa</span>
                </button>

                <button
                  type="button"
                  onclick="appActions.openDeleteRoomModal('${room.id}')"
                  class="w-full h-10 px-1.5 bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-600 border border-rose-200 font-extrabold text-[11px] sm:text-xs rounded-xl flex items-center justify-center gap-1 transition shadow-2xs whitespace-nowrap"
                  title="Xoá Phòng"
                >
                  ${ICON_TRASH}
                  <span>Xoá</span>
                </button>

                <button
                  type="button"
                  onclick="appActions.selectRoomForCalculator('${room.id}')"
                  class="w-full h-10 px-1.5 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-[11px] sm:text-xs rounded-xl flex items-center justify-center gap-1 transition shadow-xs whitespace-nowrap"
                  title="Tính Tiền Phòng"
                >
                  <span>🧮 Tính Tiền</span>
                </button>

                <button
                  type="button"
                  onclick="appActions.saveAndOpenRoomReceipt('${room.id}')"
                  class="w-full h-10 px-1.5 bg-teal-600 hover:bg-teal-700 active:scale-95 text-white font-extrabold text-[11px] sm:text-xs rounded-xl flex items-center justify-center gap-1 transition shadow-xs whitespace-nowrap"
                  title="Xem Phiếu & Mã VietQR"
                >
                  <span>📄 Phiếu QR</span>
                </button>
              </div>
            </div>
          </div>
        `;
      };

      // Xây dựng danh sách hiển thị: Nếu có phòng được phân loại theo Dãy / Lầu / Trệt thì gom nhóm trực quan,
      // còn nếu người tạo không phân loại thì hiển thị lưới bình thường
      let roomsDisplayHtml = '';
      if (filteredRooms.length === 0) {
        roomsDisplayHtml = `
          <div class="bg-white rounded-2xl p-6 text-center border border-slate-200 space-y-2">
            <div class="text-2xl">🔍</div>
            <div class="font-bold text-sm text-slate-800">Không tìm thấy phòng phù hợp</div>
            <p class="text-xs text-slate-400">Hãy thử từ khóa khác hoặc xóa bộ lọc hiện tại.</p>
            <button
              onclick="appActions.clearRoomSearch()"
              class="mt-1 bg-teal-50 text-teal-700 font-bold text-xs px-3 py-1.5 rounded-xl border border-teal-200"
            >Xoá Bộ Lọc Tìm Kiếm</button>
          </div>
        `;
      } else if (!hasAnyClassification) {
        // Không có phòng nào phân loại -> Hiển thị bình thường
        roomsDisplayHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5">
            ${filteredRooms.map((room) => renderSingleRoomCard(room)).join('')}
          </div>
        `;
      } else {
        // Có phân loại theo Dãy, Trên lầu hoặc Trệt -> Chia thành từng nhóm rõ ràng
        const groupsMap = new Map();
        const uncategorizedRooms = [];

        filteredRooms.forEach((room) => {
          const z = String(room.zone || '').trim();
          const fl = getFloorLabel(room.floorLevel);
          if (!z && !fl) {
            uncategorizedRooms.push(room);
          } else {
            const key = `${z}__${room.floorLevel || ''}`;
            if (!groupsMap.has(key)) {
              let titleParts = [];
              if (z) titleParts.push(`📍 ${escapeHtml(z)}`);
              if (fl) {
                titleParts.push(
                  room.floorLevel === 'upstairs' ? '⬆️ Khu vực Trên lầu' : '⬇️ Khu vực Tầng Trệt'
                );
              }
              groupsMap.set(key, {
                title: titleParts.join(' • '),
                zone: z,
                floorLevel: room.floorLevel || '',
                rooms: []
              });
            }
            groupsMap.get(key).rooms.push(room);
          }
        });

        const groupedSectionsHtml = Array.from(groupsMap.values())
          .map((grp) => {
            const grpTotal = grp.rooms.reduce((s, r) => s + calculateRoomBill(r).grandTotal, 0);
            const grpPaidCount = grp.rooms.filter((r) => r.status === 'PAID').length;
            return `
              <div class="space-y-2.5">
                <div class="flex items-center justify-between bg-teal-900/95 text-white px-3.5 py-2 rounded-2xl shadow-2xs">
                  <div class="flex items-center gap-2">
                    <span class="font-extrabold text-xs sm:text-sm">${grp.title}</span>
                    <span class="bg-white/20 text-emerald-100 text-[10px] font-bold px-2 py-0.5 rounded-full">
                      ${grp.rooms.length} phòng (Đã thu ${grpPaidCount}/${grp.rooms.length})
                    </span>
                  </div>
                  <div class="text-right">
                    <span class="text-[10px] text-emerald-200 mr-1">Tổng nhóm:</span>
                    <span class="font-black text-xs sm:text-sm text-amber-300">${formatVND(
                      grpTotal
                    )}</span>
                  </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5">
                  ${grp.rooms.map((room) => renderSingleRoomCard(room)).join('')}
                </div>
              </div>
            `;
          })
          .join('');

        const uncategorizedHtml =
          uncategorizedRooms.length > 0
            ? `
              <div class="space-y-2.5">
                <div class="flex items-center justify-between bg-slate-700 text-white px-3.5 py-2 rounded-2xl shadow-2xs">
                  <div class="flex items-center gap-2">
                    <span class="font-extrabold text-xs sm:text-sm">🏠 Phòng chưa phân loại Dãy / Lầu / Trệt</span>
                    <span class="bg-white/20 text-slate-100 text-[10px] font-bold px-2 py-0.5 rounded-full">
                      ${uncategorizedRooms.length} phòng
                    </span>
                  </div>
                  <span class="font-black text-xs sm:text-sm text-amber-300">${formatVND(
                    uncategorizedRooms.reduce((s, r) => s + calculateRoomBill(r).grandTotal, 0)
                  )}</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5">
                  ${uncategorizedRooms.map((room) => renderSingleRoomCard(room)).join('')}
                </div>
              </div>
            `
            : '';

        roomsDisplayHtml = `<div class="space-y-5">${groupedSectionsHtml}${uncategorizedHtml}</div>`;
      }

      return `
        <!-- Thẻ tổng hợp doanh thu kỳ hiện tại -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-4 shadow-md space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] uppercase tracking-wider text-teal-400 font-bold">Doanh số dự kiến kỳ ${escapeHtml(
                state.settings.billingMonth
              )}</span>
              <div id="dash-total-expected" class="text-xl font-black text-white mt-0.5">${formatVND(
                totalExpected
              )}</div>
            </div>
            <button
              onclick="appActions.rolloverAllRoomsToNewMonth()"
              class="bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-bold text-teal-300 border border-teal-500/30 px-3 py-2 rounded-xl flex items-center gap-1.5 transition"
            >
              <span>🔄 Sang Kỳ Mới</span>
            </button>
          </div>

          <!-- Thanh tiến độ thu tiền -->
          <div class="space-y-1">
            <div class="flex justify-between text-[11px]">
              <span class="text-slate-300">Tiến độ thu tiền kỳ này</span>
              <span class="font-extrabold text-emerald-400">${collectionProgress}% (${
        state.rooms.length - unpaidCount
      }/${state.rooms.length} phòng)</span>
            </div>
            <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-teal-400 to-emerald-400 rounded-full transition-all" style="width: ${collectionProgress}%"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5 pt-1 border-t border-slate-700/80 text-xs">
            <div class="bg-white/5 rounded-xl p-2.5 flex items-center justify-between">
              <span class="text-slate-300">Đã thu (${state.rooms.length - unpaidCount}):</span>
              <span class="font-bold text-emerald-400">${formatVND(totalPaid)}</span>
            </div>
            <div class="bg-white/5 rounded-xl p-2.5 flex items-center justify-between">
              <span class="text-slate-300">Chưa thu (${unpaidCount}):</span>
              <span id="dash-total-unpaid" class="font-bold text-amber-400">${formatVND(
                totalUnpaid
              )}</span>
            </div>
          </div>
        </div>

        <!-- THANH TÌM KIẾM & BỘ LỌC PHÒNG TRỌ -->
        <div class="bg-white rounded-2xl p-3 border border-slate-200/90 shadow-xs space-y-2.5">
          <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
            ${ICON_SEARCH}
            <input
              id="room-search-input"
              type="text"
              placeholder="Tìm tên phòng, dãy, tên khách thuê, SĐT..."
              value="${escapeHtml(state.roomSearchQuery)}"
              oninput="appActions.setRoomSearch(this.value)"
              class="w-full bg-transparent text-xs font-semibold text-slate-900 focus:outline-none"
            />
            ${
              state.roomSearchQuery
                ? `<button onclick="appActions.setRoomSearch('')" class="text-xs font-bold text-slate-400 hover:text-slate-700 px-1">✕</button>`
                : ''
            }
          </div>

          ${
            hasAnyClassification
              ? `<!-- Phân loại theo Tầng (Trệt / Trên lầu) và Dãy phòng (chỉ hiện khi có phân loại) -->
                <div class="flex items-center justify-between gap-1.5 flex-wrap text-[11px]">
                  ${
                    hasAnyFloor
                      ? `<div class="flex items-center gap-1 flex-wrap">
                          <span class="text-[10px] font-bold text-slate-400 mr-0.5">Tầng:</span>
                          ${[
                            { id: 'ALL', label: 'Tất Cả Tầng' },
                            { id: 'ground', label: '⬇️ Trệt' },
                            { id: 'upstairs', label: '⬆️ Trên Lầu' }
                          ]
                            .map(
                              (fl) => `
                            <button
                              onclick="appActions.setRoomFilterFloor('${fl.id}')"
                              class="px-2.5 py-1 rounded-lg font-bold transition ${
                                state.roomFilterFloor === fl.id
                                  ? 'bg-indigo-600 text-white shadow-2xs'
                                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                              }"
                            >${fl.label}</button>
                          `
                            )
                            .join('')}
                        </div>`
                      : ''
                  }

                  ${
                    availableZones.length > 0
                      ? `<div class="flex items-center gap-1 flex-wrap">
                          <span class="text-[10px] font-bold text-slate-400 mr-0.5">Dãy:</span>
                          <button
                            onclick="appActions.setRoomFilterZone('ALL')"
                            class="px-2.5 py-1 rounded-lg font-bold transition ${
                              state.roomFilterZone === 'ALL'
                                ? 'bg-teal-700 text-white shadow-2xs'
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }"
                          >Tất Cả Dãy</button>
                          ${availableZones
                            .map(
                              (z) => `
                            <button
                              onclick="appActions.setRoomFilterZone('${escapeHtml(z)}')"
                              class="px-2.5 py-1 rounded-lg font-bold transition ${
                                state.roomFilterZone === z
                                  ? 'bg-teal-700 text-white shadow-2xs'
                                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                              }"
                            >${escapeHtml(z)}</button>
                          `
                            )
                            .join('')}
                        </div>`
                      : ''
                  }
                </div>`
              : ''
          }

          <div class="flex items-center justify-between gap-1.5 flex-wrap text-[11px] ${
            hasAnyClassification ? 'pt-1 border-t border-slate-100' : ''
          }">
            <div class="flex items-center gap-1">
              ${[
                { id: 'ALL', label: 'Tất Cả Loại' },
                { id: 'room', label: 'Phòng Trọ' },
                { id: 'kiot', label: 'Kiot' }
              ]
                .map(
                  (t) => `
                <button
                  onclick="appActions.setRoomFilterType('${t.id}')"
                  class="px-2.5 py-1 rounded-lg font-bold transition ${
                    state.roomFilterType === t.id
                      ? 'bg-teal-600 text-white'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }"
                >${t.label}</button>
              `
                )
                .join('')}
            </div>

            <div class="flex items-center gap-1">
              ${[
                { id: 'ALL', label: 'Mọi TT' },
                { id: 'UNPAID', label: 'Chưa Thu' },
                { id: 'PAID', label: 'Đã Thu' }
              ]
                .map(
                  (st) => `
                <button
                  onclick="appActions.setRoomFilterStatus('${st.id}')"
                  class="px-2 py-1 rounded-lg font-bold transition ${
                    state.roomFilterStatus === st.id
                      ? 'bg-slate-900 text-white'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }"
                >${st.label}</button>
              `
                )
                .join('')}
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-100 text-[11px] text-slate-500">
