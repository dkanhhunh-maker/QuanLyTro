    // ============================================================================
    // 12. TAB 4: THỐNG KÊ & DOANH SỐ CHI TIẾT TỪNG PHÒNG
    // ============================================================================
    function renderAnalyticsTab() {
      const historyMonths = Array.from(new Set(state.invoices.map((i) => i.month)));

      // Đảm bảo selectedAnalyticsRoomId hợp lệ
      if (
        state.selectedAnalyticsRoomId !== 'ALL' &&
        !state.rooms.some((r) => r.id === state.selectedAnalyticsRoomId)
      ) {
        state.selectedAnalyticsRoomId = 'ALL';
      }

      const selectedRoomObj =
        state.selectedAnalyticsRoomId === 'ALL'
          ? null
          : state.rooms.find((r) => r.id === state.selectedAnalyticsRoomId);

      // Tính số liệu dựa theo bộ lọc kỳ đang chọn + phòng đang chọn
      let statsTitle = `Kỳ đang thu hiện tại (${state.settings.billingMonth})`;
      let totalExpected = 0;
      let totalPaid = 0;
      let totalUnpaid = 0;
      let sumBaseRent = 0;
      let sumElectric = 0;
      let sumWater = 0;
      let sumTrashAndExtra = 0;
      let sumExtraPerson = 0;
      let sumDebt = 0;
      let totalKwh = 0;
      let totalWaterM3 = 0;
      let totalOccupants = 0;
      let roomRanking = [];

      const roomsForCalc = selectedRoomObj ? [selectedRoomObj] : state.rooms;

      if (state.analyticsPeriod === 'CURRENT') {
        roomsForCalc.forEach((r) => {
          const b = calculateRoomBill(r);
          totalExpected += b.grandTotal;
          if (r.status === 'PAID') {
            totalPaid += b.grandTotal;
          } else {
            totalUnpaid += b.grandTotal;
          }
          sumBaseRent += b.baseRent;
          sumElectric += b.electricTotal;
          sumWater += b.waterTotal;
          sumTrashAndExtra += b.trashFee + b.extraFeesTotal;
          sumExtraPerson += b.extraPersonTotal;
          sumDebt += b.previousDebt;
          totalKwh += b.electricUsage;
          if (r.waterMode === 'meter') totalWaterM3 += b.waterUsage;
          totalOccupants += Number(r.currentOccupants) || 0;

          roomRanking.push({
            id: r.id,
            roomId: r.id,
            name: r.name,
            zone: r.zone || '',
            floorLevel: r.floorLevel || '',
            tenantName: r.tenantName || 'Khách thuê',
            type: r.type,
            status: r.status,
            total: b.grandTotal,
            kwh: b.electricUsage
          });
        });
      } else {
        let targetInvoices =
          state.analyticsPeriod === 'ALL_HISTORY'
            ? state.invoices
            : state.invoices.filter((i) => i.month === state.analyticsPeriod);

        if (selectedRoomObj) {
          targetInvoices = targetInvoices.filter((i) => i.roomId === selectedRoomObj.id);
        }

        statsTitle =
          state.analyticsPeriod === 'ALL_HISTORY'
            ? `Toàn bộ lịch sử hoá đơn (${targetInvoices.length} phiếu)`
            : `Hoá đơn lưu trữ Kỳ ${state.analyticsPeriod}`;

        targetInvoices.forEach((inv) => {
          const g = Number(inv.grandTotal) || 0;
          totalExpected += g;
          if (inv.status === 'PAID') {
            totalPaid += g;
          } else {
            totalUnpaid += g;
          }
          sumBaseRent += Number(inv.baseRent) || 0;
          sumElectric += Number(inv.electric?.total) || 0;
          sumWater += Number(inv.water?.total) || 0;
          const efSum = (inv.extraFees || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
          sumTrashAndExtra += (Number(inv.trashFee) || 0) + efSum;
          sumExtraPerson += Number(inv.extraPersonTotal) || 0;
          sumDebt += Number(inv.previousDebt) || 0;
          totalKwh += Number(inv.electric?.usage) || 0;
          if (inv.water?.mode === 'meter') totalWaterM3 += Number(inv.water?.usage) || 0;
          totalOccupants += Number(inv.currentOccupants) || 0;

          roomRanking.push({
            id: inv.id,
            roomId: inv.roomId,
            name: `${inv.roomName} (${inv.month})`,
            zone: inv.zone || '',
            floorLevel: inv.floorLevel || '',
            tenantName: inv.tenantName || 'Khách thuê',
            type: inv.roomType || 'room',
            status: inv.status,
            total: g,
            kwh: Number(inv.electric?.usage) || 0
          });
        });
      }

      roomRanking.sort((a, b) => b.total - a.total);
      const maxRoomTotal =
        roomRanking.length > 0 ? Math.max(...roomRanking.map((r) => r.total), 1) : 1;
      const paidRate =
        totalExpected > 0 ? Math.min(100, Math.round((totalPaid / totalExpected) * 100)) : 0;

      // Tổng hợp doanh số theo từng kỳ tháng trong lịch sử để so sánh
      const monthlySummaryMap = {};
      state.invoices
        .filter((inv) => !selectedRoomObj || inv.roomId === selectedRoomObj.id)
        .forEach((inv) => {
          if (!monthlySummaryMap[inv.month]) {
            monthlySummaryMap[inv.month] = {
              month: inv.month,
              total: 0,
              paid: 0,
              unpaid: 0,
              count: 0
            };
          }
          const g = Number(inv.grandTotal) || 0;
          monthlySummaryMap[inv.month].total += g;
          monthlySummaryMap[inv.month].count += 1;
          if (inv.status === 'PAID') monthlySummaryMap[inv.month].paid += g;
          else monthlySummaryMap[inv.month].unpaid += g;
        });
      const monthlyList = Object.values(monthlySummaryMap);

      const breakdownItems = [
        { label: '🏠 Tiền thuê phòng cơ bản', amount: sumBaseRent, color: 'bg-teal-500' },
        { label: '⚡ Tiền điện tiêu thụ', amount: sumElectric, color: 'bg-amber-500' },
        { label: '💧 Tiền nước sinh hoạt', amount: sumWater, color: 'bg-sky-500' },
        { label: '👥 Phụ thu thêm người', amount: sumExtraPerson, color: 'bg-indigo-500' },
        { label: '🗑️ Tiền rác & Phí phát sinh', amount: sumTrashAndExtra, color: 'bg-purple-500' },
        { label: '📌 Công nợ / Dư kỳ trước', amount: sumDebt, color: 'bg-rose-500' }
      ];

      // Chi tiết từng khoản của phòng đang được chọn
      const selectedRoomBill = selectedRoomObj ? calculateRoomBill(selectedRoomObj) : null;
      const selectedRoomHistory = selectedRoomObj
        ? state.invoices.filter((inv) => inv.roomId === selectedRoomObj.id)
        : [];

      return `
        <!-- BỘ CHỌN XEM DOANH THU CHI TIẾT TỪNG PHÒNG -->
        <div class="bg-white rounded-2xl p-3.5 border border-teal-200 shadow-xs space-y-3">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div>
              <span class="text-xs font-extrabold text-slate-900 block">🔍 Chọn phòng để xem doanh thu chi tiết:</span>
              <span class="text-[11px] text-slate-500">Xem tổng thể toàn nhà trọ hoặc bấm chọn từng phòng cụ thể</span>
            </div>
            <select
              onchange="appActions.setAnalyticsRoom(this.value)"
              class="bg-teal-50 border border-teal-300 text-teal-950 text-xs font-extrabold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500"
            >
              <option value="ALL" ${
                state.selectedAnalyticsRoomId === 'ALL' ? 'selected' : ''
              }>🏠 Tất cả phòng (${state.rooms.length} phòng)</option>
              ${state.rooms
                .map(
                  (r) => `
                <option value="${r.id}" ${
                    state.selectedAnalyticsRoomId === r.id ? 'selected' : ''
                  }>
                  ${escapeHtml(r.name)}${
                    getRoomCategorySummary(r)
                      ? ` • ${escapeHtml(getRoomCategorySummary(r))}`
                      : ''
                  } - ${formatVND(calculateRoomBill(r).grandTotal)}
                </option>
              `
                )
                .join('')}
            </select>
          </div>

          <!-- Dãy nút bấm chọn nhanh từng phòng -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            <button
              onclick="appActions.setAnalyticsRoom('ALL')"
              class="px-3 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${
                state.selectedAnalyticsRoomId === 'ALL'
                  ? 'bg-slate-900 text-white shadow-xs'
                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
              }"
            >
              Tất Cả (${state.rooms.length})
            </button>
            ${state.rooms
              .map(
                (r) => `
              <button
                onclick="appActions.setAnalyticsRoom('${r.id}')"
                class="px-3 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition flex items-center gap-1 ${
                  state.selectedAnalyticsRoomId === r.id
                    ? 'bg-teal-600 text-white shadow-xs'
                    : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                }"
              >
                <span>${escapeHtml(r.name)}</span>
                ${
                  getRoomCategorySummary(r)
                    ? `<span class="text-[10px] opacity-80">(${escapeHtml(
                        getRoomCategorySummary(r)
                      )})</span>`
                    : ''
                }
              </button>
            `
              )
              .join('')}
          </div>

          <!-- Bộ chọn kỳ xem báo cáo doanh số -->
          <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-2 flex-wrap">
            <span class="text-[11px] font-bold text-slate-500">Kỳ thống kê: <b class="text-teal-700">${escapeHtml(
              statsTitle
            )}</b></span>
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
              <button
                onclick="appActions.setAnalyticsPeriod('CURRENT')"
                class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold whitespace-nowrap transition ${
                  state.analyticsPeriod === 'CURRENT'
                    ? 'bg-teal-600 text-white'
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }"
              >
                Kỳ Hiện Tại (${escapeHtml(state.settings.billingMonth)})
              </button>
              <button
                onclick="appActions.setAnalyticsPeriod('ALL_HISTORY')"
                class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold whitespace-nowrap transition ${
                  state.analyticsPeriod === 'ALL_HISTORY'
                    ? 'bg-teal-600 text-white'
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }"
              >
                Lịch Sử Tất Cả Kỳ
              </button>
              ${historyMonths
                .map(
                  (m) => `
                <button
                  onclick="appActions.setAnalyticsPeriod('${escapeHtml(m)}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold whitespace-nowrap transition ${
                    state.analyticsPeriod === m
                      ? 'bg-teal-600 text-white'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }"
                >

      if (!m) return '';

      const extraCount = Math.max(
        0,
        (Number(m.currentOccupants) || 1) - (Number(m.standardOccupants) || 2)
      );
      const extraMoney = extraCount * (Number(m.extraPersonFee) || 0);

      return `
        <div class="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-3">

            <!-- Header Modal -->
            <div class="bg-slate-900 text-white px-4 py-3.5 flex items-center justify-between shrink-0">
              <div class="flex items-center gap-2">
                <span class="p-1.5 rounded-xl bg-teal-500/20 text-teal-300">
                  ${ICON_PENCIL}
                </span>
                <div>
                  <h3 class="font-extrabold text-sm">
                    ${
                      m.isNew
                        ? 'Thêm Phòng trọ / Kiot Mới'
                        : `Sửa chi tiết: ${escapeHtml(m.name)}`
                    }

                  <p class="text-[11px] text-slate-400">Chỉnh sửa đầy đủ thông số cấu hình của phòng</p>

                    <label class="block font-bold text-slate-600 mb-1">Tên Phòng / Kiot *</label>

                      type="text"

                      <option value="kiot" ${m.type === 'kiot' ? 'selected' : ''}>Kiot</option>

                  <div>

                      <option value="ground" ${
                        m.floorLevel === 'ground' ? 'selected' : ''

            <h3 class="font-extrabold text-base text-slate-900">${escapeHtml(c.title)}</h3>
            <p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(c.message)}</p>
            <div class="flex gap-2 pt-1">
              <button
                onclick="state.confirmModal = null; renderApp();"
                class="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-xs text-slate-700"
              >Huỷ Bỏ</button>
              <button
                id="confirm-modal-ok-btn"
                class="flex-1 py-2.5 rounded-xl font-extrabold text-xs text-white ${
                  c.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-teal-600 hover:bg-teal-700'
                }"
              >${escapeHtml(c.confirmText || 'Đồng Ý')}</button>
            </div>
          </div>
        </div>
      `;
    }

    // Gắn sự kiện cho nút xác nhận của Confirm Modal sau mỗi lần render
    const originalRender = renderApp;
    renderApp = function () {
      originalRender();
      if (state.confirmModal && typeof state.confirmModal.onConfirm === 'function') {
        const btn = document.getElementById('confirm-modal-ok-btn');
        if (btn) btn.onclick = state.confirmModal.onConfirm;
      }
    };

    // Khởi chạy ứng dụng khi tải trang
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderApp();
    });
  </script>

</body>
</html>
