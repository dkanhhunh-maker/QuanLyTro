plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.hoanguyen.quanlynhatro'
    compileSdk 34

    defaultConfig {
        applicationId "vn.hoanguyen.quanlynhatro"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0-HoaNguyen"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
